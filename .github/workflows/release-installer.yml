name: Attach Windows installer
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach an installer to
        required: true
        type: string
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: builder
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: source
      - name: Validate release version and build
        shell: powershell
        run: |
          $version = (Get-Content source/VERSION -Raw).Trim()
          if ($env:RELEASE_TAG -cne ('v' + $version)) { throw 'Release tag does not match VERSION.' }
          ./builder/installer/Build-Installer.ps1 -SourceRoot source -OutputDirectory dist -SourceCommit (git -C source rev-parse HEAD)
      - name: Attach installer and checksum
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist -File | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
